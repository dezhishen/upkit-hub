name: Build Release Artifacts

# 可复用工作流：构建插件产物并生成订阅清单 feed.yaml。
#
# 它被两处调用，共用同一份定义，避免两条路径各写一遍后悄悄漂移：
#   · ci.yml      —— main 上的发布演练，产物进 artifact 供下载核对，不发 Release
#   · release.yml —— 真发版，产物交给 publish job 上传到 Release
#
# 本工作流**只构建**：不碰 tag、不碰 Release。
#
# 两条约束来自宿主里写死的订阅地址
# （https://github.com/dezhishen/upkit-hub/releases/latest/download/feed.yaml）：
#   1. 清单必须叫 feed.yaml，且是 Release 附件；
#   2. 清单里的产物地址写成相对形式（./<文件>），由宿主相对**订阅地址**解析。
#      内置地址取的是同一次发布里的 feed.yaml，因此解析结果落在同一次发布的产物上：
#      同源（用户不必额外确认「下载域名」），也不必把 tag 写进清单 —— 写死 tag 反而会让
#      订阅地址与产物地址指向两次不同的发布（latest 的清单 + 旧 tag 的产物）。

on:
  workflow_call:
    inputs:
      version:
        description: 版本号，也是 tag（形如 v0.1.0 或 v0.2.0-rc.1）
        required: true
        type: string
      artifact-name:
        description: 上传产物时使用的 artifact 名
        required: false
        type: string
        default: release-dist
      base-url:
        description: 产物地址的绝对前缀（自建分发、内网镜像时用）；留空则写成相对形式 ./<文件>
        required: false
        type: string
        default: ""
      min-host-version:
        description: 要求的最低宿主版本（留空则不写该字段）
        required: false
        type: string
        default: ""
      schema:
        description: >-
          清单 schema：1 = 不含域名声明；2 = 写入 download_hosts/plugin_hosts。
          改成 2 的前提是宿主已支持（SchemaVersion >= 2）并已发布、用户升级到位：
          官方源走 releases/latest，新字段一发就全量生效，旧宿主会整份拒绝解析。
          声明本身不手写，由 cmd/upkit-hub 从 catalog 推导。
        required: false
        type: string
        default: "1"

permissions:
  contents: read

jobs:
  build:
    name: 构建插件与清单
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: 计算插件版本（tag 去掉 v 前缀）
        id: ver
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # 宿主拒绝以符号开头、或含其它字符的版本号（它会被拼进缓存文件名），
          # 这里提前把不合规的 tag 拦下来。
          if [[ ! "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$ ]]; then
            echo "::error::版本号 ${version} 不合规（由 tag ${TAG} 得出）"
            exit 1
          fi
          echo "version=${version}" >>"$GITHUB_OUTPUT"

      - name: 构建 windows/amd64 与 windows/arm64
        env:
          PLUGIN_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # 两个架构都必须构建：漏一个架构，那个架构的用户会在「校验订阅」
          # 这一步失败，而 gen-feed.sh 也会因此拒绝生成清单。
          for target in windows/amd64 windows/arm64; do
            bash scripts/build-plugin.sh --release-name -v "$PLUGIN_VERSION" \
              -t "$target" ./cmd/upkit-hub
          done
          ls -l dist/plugins

      - name: 生成清单
        env:
          PLUGIN_VERSION: ${{ steps.ver.outputs.version }}
          INPUT_BASE_URL: ${{ inputs.base-url }}
          MIN_HOST: ${{ inputs.min-host-version }}
          SCHEMA: ${{ inputs.schema }}
        run: |
          set -euo pipefail

          mkdir -p dist/release
          # 产物与清单放同一目录：摘要由脚本现算，摆在一起就不会出现
          # 「算的是 A 目录、发的是 B 目录」这种错。
          cp dist/plugins/*.exe dist/release/

          args=(
            --plugins-dir dist/release
            --version "$PLUGIN_VERSION"
            --schema "$SCHEMA"
            --name "upkit-hub=upkit 官方插件集"
            -n "upkit 官方源"
            -o dist/release/feed.yaml
          )
          if [[ "$SCHEMA" == "2" ]]; then
            # 域名声明由插件自己从 catalog 推导（唯一事实来源），不手写 ——
            # 手写必然跟代码漂移，而这条声明是要拿去强制校验下载地址的。
            mapfile -t decl < <(go run ./cmd/upkit-hub -print-declarations)
            printf '域名声明：\n  %s\n' "${decl[*]}"
            args+=("${decl[@]}")
          fi
          if [[ -n "$INPUT_BASE_URL" ]]; then
            echo "产物地址前缀: ${INPUT_BASE_URL}（绝对地址）"
            args+=(--base-url "$INPUT_BASE_URL")
          else
            # 默认相对形式：解析发生在用户拿到的订阅地址上，因此与订阅天然同源。
            echo "产物地址: 相对（./<文件>）"
            args+=(--relative)
          fi
          if [[ -n "$MIN_HOST" ]]; then
            args+=(--min-host-version "$MIN_HOST")
          fi
          bash scripts/gen-feed.sh "${args[@]}"
          echo "--- feed.yaml ---"
          cat dist/release/feed.yaml

      - name: 校验清单（宿主同一套规则 + 与产物逐字节比对）
        run: |
          set -euo pipefail
          go run ./cmd/feedcheck -feed dist/release/feed.yaml -artifacts dist/release

      - name: 确认产物是 Windows 可执行文件且版本已注入
        env:
          PLUGIN_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          for f in dist/release/*.exe; do
            if ! file "$f" | grep -q 'PE32'; then
              echo "::error::$f 不是 Windows 可执行文件"
              exit 1
            fi
            # -ldflags -X main.version=... 注入的是明文字符串，能直接 grep 到。
            # 符号路径写错时 -X 不会报错、只会静默保留 dev，这里正好把它抓出来。
            if ! grep -aq "$PLUGIN_VERSION" "$f"; then
              echo "::error::$f 里找不到版本号 $PLUGIN_VERSION，-X main.version 可能没生效"
              exit 1
            fi
          done
          ls -l dist/release

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          # 清单必须原样叫 feed.yaml：它是内置订阅地址指向的那个附件名。
          path: dist/release/*
